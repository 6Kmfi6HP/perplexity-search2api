[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perplexity-search2api"
version = "0.2.0"
description = "Perplexity Pro search and reasoning gateway with OpenAI-compatible API and CLI"
readme = "README.md"
authors = [
    { name = "Perplexity Search2API Contributors" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = [
    "perplexity",
    "search2api",
    "openai-compatible",
    "fastapi",
    "copilot",
    "nextauth",
    "search",
    "llm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.28.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.10.0",
    "openai>=1.60.0",
    "rich>=13.9.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
pplx = "cli:main"
perplexity-search2api = "cli:main"
perplexity-api = "cli:main"

[project.urls]
Homepage = "https://github.com/6Kmfi6HP/perplexity-search2api"
Repository = "https://github.com/6Kmfi6HP/perplexity-search2api"
Issues = "https://github.com/6Kmfi6HP/perplexity-search2api/issues"

[tool.setuptools]
py-modules = ["cli", "perplexity_auth", "perplexity_client", "perplexity_config", "server"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
    "B904",  # raise without from
]
